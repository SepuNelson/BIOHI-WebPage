<meta charset="utf-8">
<title>BIOHI — animación de logo</title>
<style>
  html,body { margin:0; height:100%; background:#000; display:grid; place-items:center; overflow:hidden; }
  #stage { width:1600px; height:685px; position:relative; transform-origin:center;
            animation: fitscale 0s; }
  svg { position:absolute; inset:0; width:100%; height:100%; }

  /* --- glifos: se dibujan como trazo y luego se rellenan --- */
  .g {
    fill:#03a345; fill-opacity:0;
    stroke:#03a345; stroke-width:1.6; stroke-dasharray:1 1; stroke-dashoffset:1;
    animation: draw 1.5s cubic-bezier(.5,0,.2,1) forwards,
               fill 1.1s ease-out forwards;
  }
  .g0 { animation-delay:.35s, 1.55s }
  .g1 { animation-delay:.55s, 1.75s }
  .g2 { animation-delay:.75s, 1.95s }
  .g3 { animation-delay:.95s, 2.15s }
  .g4 { animation-delay:1.15s, 2.35s }

  @keyframes draw { to { stroke-dashoffset:0 } }
  @keyframes fill { from { fill-opacity:0; stroke-opacity:1 }
                     to   { fill-opacity:1; stroke-opacity:0 } }

  /* --- placa de petri: anillo que se expande --- */
  .dish { fill:none; stroke:#03a345; transform-origin:800px 342px;
           animation: dish 3.2s cubic-bezier(.2,.7,.2,1) forwards; }
  @keyframes dish {
    0%   { transform:scale(.15); opacity:0; stroke-width:14 }
    18%  { opacity:.55 }
    100% { transform:scale(1.9); opacity:0; stroke-width:1 }
  }

  /* --- barrido de luz sobre el logo --- */
  #sweep { opacity:0; animation: sweep 1.4s ease-in-out 2.6s; }
  @keyframes sweep { 0%,100% { opacity:0 } 35%,65% { opacity:.9 } }
  #sweepRect { animation: sweepMove 1.4s ease-in-out 2.6s; }
  @keyframes sweepMove { from { transform:translateX(-350px) } to { transform:translateX(1950px) } }

  /* --- respiración del glow: se mantiene indefinidamente al final --- */
  #logo { transform-origin:800px 342px;
           animation: breathe 3.4s ease-in-out 3.6s infinite; }
  @keyframes breathe { 0%,100% { filter:url(#glow) brightness(1) }
                        50%     { filter:url(#glow) brightness(1.3) } }

  /* --- microorganismos a la deriva --- */
  .p { fill:#03a345; opacity:0; animation-name:drift; animation-timing-function:linear;
        animation-iteration-count:infinite; filter:url(#glow); }
  @keyframes drift {
    0%   { opacity:0; transform:translate(0,0) }
    12%  { opacity:.35 }
    80%  { opacity:.2 }
    100% { opacity:0; transform:translate(var(--dx),var(--dy)) }
  }
</style>

<script>
  // escala al viewport (solo previsualización)
  const fit = () => {
    const s = Math.min(innerWidth / 1600, innerHeight / 685);
    stage.style.transform = `scale(${s})`;
  };
  addEventListener('resize', fit); fit();

  // barra espaciadora = repetir
  addEventListener('keydown', e => { if (e.code === 'Space') location.reload(); });

  // para capturar frames: seek(ms) congela la animación en ese instante.
  // logo-anim.html?t=3300 abre directo en ese frame.
  window.seek = ms => document.getAnimations().forEach(a => { a.pause(); a.currentTime = ms; });
  const q = new URLSearchParams(location.search);
  // ?alpha=1 quita el fondo negro (para componer sobre otro material)
  if (q.has('alpha')) { bg.remove(); document.documentElement.style.background = 'transparent'; }
  const t = q.get('t');
  if (t !== null) seek(+t);
</script>
